  nav: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px 18px' },

function S2Avatar({ person, size = 44, ring = false }) {
  const rv = relStyle(person.rel);
  return (
    <div style={{
      ...s2.avatar, width: size, height: size, fontSize: size * 0.38,
      background: rv.bg, color: rv.fg,
      boxShadow: ring ? '0 0 0 2.5px #fff, 0 0 0 4.5px ' + rv.fg + '30' : 'none',
    }}>{person.name[0]}</div>
  );
}

/* ---------- home ---------- */
function S2Home({ people, filter, setFilter, query, setQuery, sort, setSort, onOpen, onAdd, onRandom }) {
  let list = people.filter(p => filter === '全部' || p.rel === filter);
  if (query.trim()) {
    const q = query.trim();
    list = list.filter(p => p.name.includes(q) || p.bio.includes(q) || p.entries.some(e => e.title.includes(q) || (e.content || '').includes(q)));
  }
  if (sort === '姓名') list = [...list].sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  const total = people.reduce((n, p) => n + p.entries.length, 0);
  return (
    <div style={{ ...s2.screen, paddingBottom: 90 }}>
      <div style={{ padding: '18px 20px 0' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div style={{ fontSize: 33, fontWeight: 700, letterSpacing: -0.5 }}>人物</div>
          <div onClick={() => setSort(sort === '更新' ? '姓名' : '更新')} style={{ fontSize: 12.5, color: BLUE, cursor: 'pointer' }}>
            {sort === '更新' ? '最近更新' : '按姓名'} ⌄

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 6 }}>

              <path d="M8.9 8.2l1.9 1.2-1.9 1.2" stroke="#5F636B" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round" />

        <div style={{ display: 'flex', gap: 18, overflowX: 'auto', marginTop: 14, paddingBottom: 9, borderBottom: '1px solid ' + HAIR }}>

          <div style={{ padding: '40px 0 48px', textAlign: 'center' }}>
            <div style={{ position: 'relative', width: 72, height: 56, margin: '0 auto 18px' }}>
              <div style={{ position: 'absolute', left: 6, top: 2, width: 50, height: 32, background: '#EDEEF2', borderRadius: 6, transform: 'rotate(-7deg)' }} />

/* ---------- detail ---------- */
function S2Detail({ person, onBack, onEdit, onAddEntry, onOpenEntry }) {
  const cats = [];
  person.entries.forEach(e => { if (!cats.includes(e.cat)) cats.push(e.cat); });
  const [cat, setCat] = useState('全部');
  const list = cat === '全部' ? person.entries : person.entries.filter(e => e.cat === cat);
  const rv = relStyle(person.rel);
  return (
    <div style={{ ...s2.screen, paddingBottom: 30 }}>
      <div style={s2.nav}>
        <div style={s2.navBack} onClick={onBack}><span style={{ fontSize: 22, lineHeight: 1 }}>‹</span> 人物</div>
        <div style={s2.action} onClick={onEdit}>编辑</div>
      </div>

      <div style={{ padding: '2px 20px 0' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 15 }}>
          <S2Avatar person={person} size={64} ring />
          <div>
            <div style={{ fontFamily: '"Noto Serif SC", serif', fontSize: 29, fontWeight: 700, letterSpacing: 0.5 }}>{person.name}</div>

/* ---------- phone ---------- */
function S2Phone({ initial, initialPid = 1, initialEid = null }) {
  const [people, setPeople] = useState(PEOPLE);
  const [screen, setScreen] = useState(initial);
  const [pid, setPid] = useState(initialPid);
  const [eid, setEid] = useState(initialEid);
  const [openEntry, setOpenEntry] = useState(initial === 'card' ? initialEid : null);
  const [filter, setFilter] = useState('全部');
  const [query, setQuery] = useState('');
  const [sort, setSort] = useState('更新');
  const [confirm, setConfirm] = useState(null);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2100);
  };

  const randomOpen = () => {
    const pool = people.filter(p => p.id !== pid);
    const arr = pool.length ? pool : people;
    const p = arr[Math.floor(Math.random() * arr.length)];
    setPid(p.id);
    setScreen('detail');
    showToast('翻到「' + p.name + '」· ' + p.rel);
  };

  const person = people.find(p => p.id === pid) || people[0];
  const entry = person ? person.entries.find(e => e.id === eid) : null;

  const saveEntry = (data) => {
    setPeople(prev => prev.map(p => {
      if (p.id !== pid) return p;
      if (eid) return { ...p, entries: p.entries.map(e => e.id === eid ? { ...e, ...data, updated: '今天' } : e), updated: '今天' };
      return { ...p, entries: [{ id: Date.now(), ...data, created: '2025.11.24', updated: '今天' }, ...p.entries], updated: '今天' };
    }));
    setOpenEntry(null);
    setScreen('detail');
    showToast(eid ? '已更新「' + data.title + '」' : '记下了「' + data.title + '」');
  };

  const deleteEntry = () => {
    setPeople(prev => prev.map(p => p.id === pid ? { ...p, entries: p.entries.filter(e => e.id !== eid) } : p));
    setOpenEntry(null); setConfirm(null); setScreen('detail');
  };

  const savePerson = (data) => {
    if (screen === 'newPerson') {
      const id = Date.now();
      setPeople(prev => [{ id, ...data, created: '2025.11.24', updated: '今天', entries: [] }, ...prev]);
      setPid(id); setScreen('detail');
      showToast('新建了「' + data.name + '」');
    } else {
      setPeople(prev => prev.map(p => p.id === pid ? { ...p, ...data, updated: '今天' } : p));
      setScreen('detail');
    }
  };

  let body = null;
  if (screen === 'home') body = <S2Home people={people} filter={filter} setFilter={setFilter} query={query} setQuery={setQuery} sort={sort} setSort={setSort} onOpen={id => { setPid(id); setScreen('detail'); }} onAdd={() => setScreen('newPerson')} onRandom={randomOpen} />;
  else if (screen === 'detail') body = <S2Detail person={person} onBack={() => setScreen('home')} onEdit={() => setScreen('editPerson')} onAddEntry={() => { setEid(null); setScreen('entryForm'); }} onOpenEntry={id => { setEid(id); setOpenEntry(id); }} />;
  else if (screen === 'card') body = <S2Detail person={person} onBack={() => setScreen('home')} onEdit={() => setScreen('editPerson')} onAddEntry={() => { setEid(null); setScreen('entryForm'); }} onOpenEntry={id => { setEid(id); setOpenEntry(id); }} />;
  else if (screen === 'entryForm') body = <S2EntryForm person={person} entry={entry} onSave={saveEntry} onBack={() => setScreen(eid ? 'detail' : 'detail')} />;
  else if (screen === 'editPerson') body = <S2PersonForm person={person} isNew={false} onSave={savePerson} onBack={() => setScreen('detail')} />;
  else if (screen === 'newPerson') body = <S2PersonForm person={null} isNew onSave={savePerson} onBack={() => setScreen('home')} />;

  return (
    <AndroidFrame time="9:41" battery={64}>
      {body}
      {openEntry && (
        <S2EntryCard person={person} entry={person.entries.find(e => e.id === openEntry) || person.entries[0]}
          onClose={() => { setOpenEntry(null); if (screen === 'card') setScreen('detail'); }}
          onEdit={() => { setEid(openEntry); setOpenEntry(null); setScreen('entryForm'); }}
          onDelete={() => setConfirm('entry')} />
      )}
      {confirm && (
        <div style={{ position: 'absolute', inset: 0, background: 'rgba(20,20,24,0.3)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 30, zIndex: 70 }}>
          <div style={{ background: '#fff', borderRadius: 14, padding: '22px 20px 16px', width: '100%' }}>
            <div style={{ fontSize: 17, fontWeight: 700 }}>删除这条词条？</div>
            <div style={{ fontSize: 12.5, color: MUTED, lineHeight: 1.7, marginTop: 8 }}>只删除这一条，人物档案会保留。删除后不可恢复。</div>
            <div style={{ display: 'flex', marginTop: 18, borderTop: '1px solid ' + HAIR }}>
              <div onClick={() => setConfirm(null)} style={{ flex: 1, textAlign: 'center', padding: '14px 0 2px', fontSize: 15, color: MUTED, cursor: 'pointer' }}>取消</div>
              <div onClick={deleteEntry} style={{ flex: 1, textAlign: 'center', padding: '14px 0 2px', fontSize: 15, color: '#E5484D', fontWeight: 600, cursor: 'pointer' }}>删除</div>
            </div>
          </div>
        </div>
      )}
      {toast && (
        <div style={{ position: 'absolute', left: '50%', bottom: 44, zIndex: 90, transform: 'translate(-50%, 0)', background: '#1D1D1F', color: '#fff', borderRadius: 999, padding: '10px 17px 10px 13px', fontSize: 13, fontWeight: 500, display: 'flex', alignItems: 'center', gap: 8, whiteSpace: 'nowrap', boxShadow: '0 12px 30px rgba(0,0,0,0.24)', animation: 's2toast 0.36s cubic-bezier(0.2, 1.3, 0.4, 1) both' }}>
          <span style={{ width: 17, height: 17, borderRadius: '50%', background: '#37C978', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, fontWeight: 700 }}>✓</span>
          {toast}
        </div>
      )}
    </AndroidFrame>
  );
}

          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {RELS.map(r => (
              <span key={r} style={{ fontSize: 11.5, fontWeight: 600, color: relStyle(r).fg, background: relStyle(r).bg, padding: '3px 10px', borderRadius: 999 }}>{r}</span>
            ))}
          </div>

          <div style={{ fontSize: 10, letterSpacing: 3, color: BLUE, fontWeight: 700, margin: '18px 0 11px' }}>CATEGORY</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px 13px' }}>
            {CATS.map(c => (
              <span key={c} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 11.5, color: '#5F636B' }}>
                <span style={{ width: 6, height: 6, borderRadius: '50%', background: catColor(c) }} />{c}
              </span>
            ))}
          </div>
        </div>
      </div>
      <div style={{ position: 'absolute', left: 56, bottom: 26, fontSize: 12, color: theme.muted }}>form 来自内容：这个 App 的动作是「想起来一条，记下来」，所以一屏只服务一次记录。</div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<S2Board />);
</script>
</body>
</html>
