function ShowboardLabel({ s, theme, width }) {
  return (
    <div style={{ width, marginBottom: 10 }}>
      <div style={{ fontSize: 15, fontWeight: 700, color: theme.fg, lineHeight: 1.3 }}>{s.label}</div>
      {s.note && <div style={{ fontSize: 13, color: theme.muted, lineHeight: 1.5, marginTop: 2 }}>{s.note}</div>}
    </div>
  );
}

function ShowboardPhone({ s, theme, x, y, scale, phoneW, phoneH }) {
  return (
    <div style={{ position: 'absolute', left: x, top: y, width: phoneW * scale }}>
      <ShowboardLabel s={s} theme={theme} width={phoneW * scale} />
      <div style={{ width: phoneW * scale, height: phoneH * scale }}>
        <div style={{ transform: `scale(${scale})`, transformOrigin: '0 0', width: phoneW }}>{s.node}</div>
      </div>
    </div>
  );
}

function Showboard({ layout = 'hero', theme = {}, title, kicker, lede, screens = [], aside, phoneW = 395, phoneH = 828, footnote }) {
  const t = { bg: '#F1F2F5', fg: '#1D1D1F', muted: '#6E727B', accent: '#3478F6', font: 'inherit', ...theme };
  const W = 1440, M = 56;
  const mainIdx = Math.max(0, screens.findIndex((s) => s.main));
  const main = screens[mainIdx], rest = screens.filter((_, i) => i !== mainIdx);
  const LABEL = 56;
  const placed = [];
  let asidePos = null, height = 0;

  const big = 1.0, small = 0.78;
  const my = 240;
  placed.push({ s: main, x: M, y: my, scale: big });
  const colX = [M + phoneW * big + 56, M + phoneW * big + 56 + phoneW * small + 36];
  rest.forEach((s, i) => {
    const col = i % 2, row = Math.floor(i / 2);
    placed.push({ s, x: colX[col], y: my - 30 + (col ? 110 : 0) + row * (phoneH * small + LABEL + 52), scale: small });
  });
  asidePos = { x: W - M - 310, y: 48, w: 310 };
  placed.forEach((p) => { height = Math.max(height, p.y + LABEL + phoneH * p.scale + M); });

  return (
    <div data-showboard={layout} style={{ position: 'relative', width: W, height, background: t.bg, color: t.fg, fontFamily: t.font, overflow: 'hidden' }}>
      <div style={{ position: 'absolute', left: M, top: 48, width: 820 }}>
        {kicker && <div style={{ fontSize: 13, color: t.accent, fontWeight: 700, marginBottom: 8 }}>{kicker}</div>}
        <div style={{ fontSize: 48, fontWeight: 900, lineHeight: 1.08, fontFamily: '"Noto Serif SC", serif' }}>{title}</div>
        {lede && <div style={{ fontSize: 15, lineHeight: 1.65, color: t.muted, marginTop: 12 }}>{lede}</div>}
      </div>
      {placed.map((p, i) => <ShowboardPhone key={i} {...p} theme={t} phoneW={phoneW} phoneH={phoneH} />)}
      {aside && asidePos && <div style={{ position: 'absolute', left: asidePos.x, top: asidePos.y, width: asidePos.w }}>{aside}</div>}
      {footnote && <div style={{ position: 'absolute', left: M, bottom: 24, fontSize: 12, color: t.muted }}>{footnote}</div>}
    </div>
  );
}

function ScreenFloatingCollector({ initialMode = 'collect' }) {
  const [people, setPeople] = useState(initialPeople);
  const [expanded, setExpanded] = useState(true);
  const [mode, setMode] = useState(initialMode);
  const [query, setQuery] = useState('');
  const [selectedId, setSelectedId] = useState(1);
  const [draftText, setDraftText] = useState(CLIPBOARD_SAMPLE);
  const [sourceType, setSourceType] = useState('剪贴板');
  const [newName, setNewName] = useState('');
  const [newBio, setNewBio] = useState('');
  const [toast, setToast] = useState('');

  const selectedPerson = people.find((p) => p.id === selectedId) || people[0];
  const filtered = people.filter((p) => p.name.includes(query.trim()));

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 2000);
  };

  const handleReadClipboard = () => {
    setDraftText(CLIPBOARD_SAMPLE);
    setSourceType('剪贴板');
    showToast('已读取剪贴板文本');
  };

  const handleSaveConv = () => {
    if (!draftText.trim() || !selectedPerson) return;
    setPeople((prev) =>
      prev.map((p) =>
        p.id === selectedPerson.id
          ? { ...p, conversations: [{ id: Date.now(), source: sourceType, time: '刚刚', text: draftText.trim() }, ...p.conversations] }
          : p
      )
    );
    setDraftText('');
    showToast(`已保存到「${selectedPerson.name}」`);
  };

  const handleQuickCreate = () => {
    if (!newName.trim()) return;
    const id = Date.now();
    const created = {
      id,
      name: newName.trim(),
      rels: ['未分组'],
      tint: { bg: '#ECEDF1', fg: '#5A5F68' },
      bio: newBio.trim(),
      updated: '刚刚',
      entries: [],
      conversations: [],
    };
    setPeople([created, ...people]);
    setSelectedId(id);
    setNewName('');
    setNewBio('');
    setMode('collect');
    showToast(`已创建并选中「${created.name}」`);
  };

  return (
    <WeChatChatBackdrop>
      <div
        onClick={() => setExpanded(!expanded)}
        title="点击展开/收起悬浮助手"
        style={{
          position: 'absolute',
          right: 12,
          top: expanded ? 56 : 260,
          width: 48,
          height: 48,
          borderRadius: '50%',
          background: '#FFFFFF',
          border: '2px solid #3478F6',
          boxShadow: '0 8px 24px rgba(52,120,246,0.28)',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          cursor: 'pointer',
          zIndex: 15,
          transition: 'all 0.22s ease',
        }}
      >
        <div style={{ width: 22, height: 22, borderRadius: 6, background: '#3478F6', color: '#FFF', fontSize: 12, fontWeight: 800, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>记</div>
      </div>

      {expanded && (
        <div style={{
          position: 'absolute',
          left: 14,
          right: 14,
          top: 96,
          bottom: 58,
          background: '#FFFFFF',
          borderRadius: 18,
          boxShadow: '0 22px 54px rgba(17,24,39,0.22), 0 0 0 1px #E6E7EC',
          display: 'flex',
          flexDirection: 'column',
          overflow: 'hidden',
          zIndex: 12,
        }}>
          <div style={{ padding: '12px 16px 10px', borderBottom: '1px solid #E6E7EC', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div>
              <div style={{ fontSize: 12, fontWeight: 700, color: '#3478F6' }}>MEMORANDUM 悬浮便签</div>
              <div style={{ fontSize: 15, fontWeight: 700, color: '#1D1D1F', marginTop: 1 }}>
                {mode === 'quickAdd' ? '快速记一个人' : mode === 'detail' ? `${selectedPerson.name}的档案` : '收集到人物档案'}
              </div>
            </div>
            <div style={{ display: 'flex', gap: 6 }}>
              <button
                onClick={() => setMode(mode === 'detail' ? 'collect' : 'detail')}
                style={{ border: '1px solid #E6E7EC', background: '#F7F7FA', borderRadius: 8, padding: '5px 9px', fontSize: 12, color: '#4C4F57', cursor: 'pointer' }}
              >
                {mode === 'detail' ? '回收集' : '看档案'}
              </button>
              <button
                onClick={() => setExpanded(false)}
                style={{ border: 'none', background: '#F2F2F6', borderRadius: 8, padding: '5px 9px', fontSize: 12, color: '#6E727B', cursor: 'pointer' }}
              >
                收起
              </button>
            </div>
          </div>

          {mode === 'collect' && (
            <div style={{ flex: 1, overflow: 'auto', padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: 12 }}>
              <div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                  <span style={{ fontSize: 12, fontWeight: 600, color: '#6E727B' }}>1. 选择归属人物（必选）</span>
                  <button onClick={() => setMode('quickAdd')} style={{ border: 'none', background: 'none', color: '#3478F6', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>
                    ＋ 添加新人物
                  </button>
                </div>
                <input
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  placeholder="搜索人物姓名…"
                  style={{ width: '100%', padding: '8px 10px', borderRadius: 10, border: 'none', background: '#F2F2F6', fontSize: 13, marginBottom: 8 }}
                />
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                  {filtered.map((p) => {
                    const active = p.id === selectedId;
                    return (
                      <div
                        key={p.id}
                        onClick={() => setSelectedId(p.id)}
                        style={{
                          display: 'flex',
                          alignItems: 'center',
                          gap: 6,
                          padding: '5px 10px',
                          borderRadius: 999,
                          background: active ? '#EBF2FF' : '#F7F7FA',
                          border: active ? '1.5px solid #3478F6' : '1px solid #E6E7EC',
                          cursor: 'pointer',
                        }}
                      >
                        <span style={{ width: 18, height: 18, borderRadius: '50%', background: p.tint.bg, color: p.tint.fg, fontSize: 11, fontWeight: 700, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>{p.name[0]}</span>
                        <span style={{ fontSize: 12.5, fontWeight: active ? 700 : 500, color: active ? '#1D1D1F' : '#4C4F57' }}>{p.name}</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                  <span style={{ fontSize: 12, fontWeight: 600, color: '#6E727B' }}>2. 对话内容（来源：{sourceType}）</span>
                  <button
                    onClick={handleReadClipboard}
                    style={{ border: '1px solid #D6E4FF', background: '#F2F6FF', color: '#3478F6', borderRadius: 8, padding: '4px 10px', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}
                  >
                    读取剪贴板
                  </button>
                </div>
                <textarea
                  value={draftText}
                  onChange={(e) => { setDraftText(e.target.value); if (!e.target.value) setSourceType('手动输入'); }}
                  placeholder="点击「读取剪贴板」或在此手动输入对话…"
                  style={{ flex: 1, minHeight: 130, padding: 12, borderRadius: 12, border: '1px solid #E6E7EC', background: '#FAFAFC', fontSize: 14, lineHeight: 1.65, color: '#1D1D1F', resize: 'none' }}
                />
                <div style={{ fontSize: 12, color: '#6E727B', marginTop: 6 }}>
                  原始文本将直接归档，不做自动分析或猜测对象。
                </div>
              </div>
            </div>
          )}

          {mode === 'quickAdd' && (
            <div style={{ flex: 1, padding: 16, display: 'flex', flexDirection: 'column', gap: 12 }}>
              <div style={{ fontSize: 12.5, color: '#6E727B', lineHeight: 1.5 }}>
                快速建档仅需姓名，创建后自动选中并回到对话收集。
              </div>
              <div>
                <div style={{ fontSize: 12, fontWeight: 600, color: '#6E727B', marginBottom: 6 }}>姓名 · 必填</div>
                <input
                  value={newName}
                  onChange={(e) => setNewName(e.target.value)}
                  placeholder="写平时怎么称呼他"
                  style={{ width: '100%', padding: '10px 12px', borderRadius: 10, border: 'none', background: '#F7F7FA', fontSize: 14 }}
                />
              </div>
              <div>
                <div style={{ fontSize: 12, fontWeight: 600, color: '#6E727B', marginBottom: 6 }}>个人简介 · 选填</div>
                <textarea
                  value={newBio}
                  onChange={(e) => setNewBio(e.target.value)}
                  placeholder="例如：滨江路工作室刚认识的设计师"
                  rows={3}
                  style={{ width: '100%', padding: '10px 12px', borderRadius: 10, border: 'none', background: '#F7F7FA', fontSize: 14, resize: 'none' }}
                />
              </div>
              <div style={{ display: 'flex', gap: 8, marginTop: 'auto' }}>
                <button onClick={() => setMode('collect')} style={{ flex: 1, padding: '11px 0', borderRadius: 10, border: '1px solid #E6E7EC', background: '#FFF', color: '#6E727B', fontSize: 14, cursor: 'pointer' }}>取消</button>
                <button onClick={handleQuickCreate} disabled={!newName.trim()} style={{ flex: 2, padding: '11px 0', borderRadius: 10, border: 'none', background: newName.trim() ? '#3478F6' : '#C9CACE', color: '#FFF', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>创建并选中</button>
              </div>
            </div>
          )}

          {mode === 'detail' && selectedPerson && (
            <div style={{ flex: 1, overflow: 'auto', padding: 16, display: 'flex', flexDirection: 'column', gap: 12 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <div style={{ width: 44, height: 44, borderRadius: '50%', background: selectedPerson.tint.bg, color: selectedPerson.tint.fg, fontSize: 18, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{selectedPerson.name[0]}</div>
                <div>
                  <div style={{ fontSize: 19, fontWeight: 700, fontFamily: '"Noto Serif SC", serif' }}>{selectedPerson.name}</div>
                  <div style={{ display: 'flex', gap: 5, marginTop: 3 }}>
                    {selectedPerson.rels.map((r) => (
                      <span key={r} style={{ fontSize: 12, fontWeight: 600, padding: '2px 8px', borderRadius: 999, background: selectedPerson.tint.bg, color: selectedPerson.tint.fg }}>{r}</span>
                    ))}
                  </div>
                </div>
              </div>
              <div style={{ fontSize: 14, color: '#4C4F57', lineHeight: 1.6 }}>{selectedPerson.bio}</div>
              <div style={{ borderTop: '1px solid #E6E7EC', paddingTop: 10 }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: '#6E727B', marginBottom: 8 }}>记忆词条（只读）</div>
                {selectedPerson.entries.map((e) => (
                  <div key={e.id} style={{ padding: '7px 0', borderBottom: '1px solid #F2F2F6' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 14, fontWeight: 600 }}>
                      <span style={{ width: 6, height: 6, borderRadius: '50%', background: e.color }} />
                      <span>{e.title}</span>
                    </div>
                    <div style={{ fontSize: 12.5, color: '#6E727B', marginTop: 2, paddingLeft: 12 }}>{e.desc}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {mode === 'collect' && (
            <div style={{ padding: '10px 16px 14px', borderTop: '1px solid #E6E7EC', display: 'flex', gap: 8 }}>
              <button onClick={() => setDraftText('')} style={{ padding: '11px 14px', borderRadius: 10, border: 'none', background: '#F2F2F6', color: '#6E727B', fontSize: 13.5, cursor: 'pointer' }}>清空</button>
              <button
                onClick={handleSaveConv}
                disabled={!draftText.trim() || !selectedPerson}
                style={{ flex: 1, padding: '11px 0', borderRadius: 10, border: 'none', background: draftText.trim() && selectedPerson ? '#3478F6' : '#C9CACE', color: '#FFF', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}
              >
                保存对话给 {selectedPerson?.name}
              </button>
            </div>
          )}
        </div>
      )}

      {toast && (
        <div style={{ position: 'absolute', bottom: 68, left: '50%', transform: 'translateX(-50%)', background: '#1D1D1F', color: '#FFF', padding: '7px 14px', borderRadius: 999, fontSize: 12, fontWeight: 500, zIndex: 30, whiteSpace: 'nowrap', boxShadow: '0 8px 20px rgba(0,0,0,0.2)' }}>
          ✓ {toast}
        </div>
      )}
    </WeChatChatBackdrop>
  );
}

function ScreenAppHome() {

  return (
    <div style={{ height: '100%', background: '#FFF', display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: '18px 20px 12px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div style={{ fontSize: 30, fontWeight: 800, letterSpacing: -0.5 }}>人物</div>
          <span style={{ fontSize: 12.5, color: '#3478F6', fontWeight: 500 }}>最近更新 ⌄</span>
        </div>
        <div style={{ fontSize: 12.5, color: '#6E727B', marginTop: 4 }}>3 个人 · 4 条词条 · 2 条对话</div>

        <div
          onClick={() => setAssistantOn(!assistantOn)}
          style={{
            marginTop: 12,
            padding: '10px 12px',
            borderRadius: 12,
            background: assistantOn ? '#F2F6FF' : '#F7F7FA',
            border: `1px solid ${assistantOn ? '#D6E4FF' : '#E6E7EC'}`,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            cursor: 'pointer',
          }}
        >
          <div>
            <div style={{ fontSize: 13.5, fontWeight: 600, color: '#1D1D1F' }}>全局悬浮助手</div>
            <div style={{ fontSize: 12, color: '#6E727B', marginTop: 1 }}>
              {assistantOn ? '已开启 · 可在微信/QQ 快捷搜人与收对话' : '已关闭 · 点此开启跨应用悬浮球'}
            </div>
          </div>
          <div style={{ width: 42, height: 24, borderRadius: 999, background: assistantOn ? '#3478F6' : '#C9CACE', padding: 2, transition: 'all 0.2s' }}>
            <div style={{ width: 20, height: 20, borderRadius: '50%', background: '#FFF', transform: assistantOn ? 'translateX(18px)' : 'none', transition: 'all 0.2s' }} />
          </div>
        </div>

        <div style={{ marginTop: 12, background: '#F2F2F6', borderRadius: 10, padding: '9px 12px', fontSize: 14, color: '#6E727B' }}>
          搜名字、简介、词条或对话…
        </div>

        <div style={{ display: 'flex', gap: 18, marginTop: 12 }}>
          {tabs.map((t) => (
            <div
              key={t}
              onClick={() => setActiveTab(t)}
              style={{ fontSize: 14, fontWeight: activeTab === t ? 700 : 500, color: activeTab === t ? '#3478F6' : '#6E727B', borderBottom: activeTab === t ? '2px solid #3478F6' : '2px solid transparent', paddingBottom: 6, cursor: 'pointer' }}
            >
              {t}
            </div>
          ))}
        </div>
      </div>

      <div style={{ borderTop: '1px solid #E6E7EC', flex: 1, padding: '0 20px', overflow: 'auto' }}>
        {initialPeople
          .filter((p) => activeTab === '全部' || p.rels.includes(activeTab))
          .map((p) => (
            <div key={p.id} style={{ display: 'flex', alignItems: 'center', padding: '12px 0', borderBottom: '1px solid #E6E7EC', gap: 12 }}>
              <div style={{ width: 42, height: 42, borderRadius: '50%', background: p.tint.bg, color: p.tint.fg, fontSize: 16, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>{p.name[0]}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 16, fontWeight: 600 }}>{p.name}</div>
                <div style={{ fontSize: 12.5, color: '#6E727B', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', marginTop: 2 }}>{p.bio}</div>
                <div style={{ fontSize: 12, color: '#6E727B', marginTop: 3 }}>
                  <span style={{ color: p.tint.fg, fontWeight: 600 }}>{p.rels.join(' · ')}</span> · {p.entries.length} 词条 · {p.conversations.length} 对话

              </div>
              <span style={{ color: '#C3C6CE', fontSize: 18 }}>›</span>
            </div>
          ))}
      </div>
    </div>
  );
}

function App() {

      screens={screens}
      aside={
        <div style={{ background: '#FFF', borderRadius: 14, padding: 16, border: '1px solid #E6E7EC' }}>
